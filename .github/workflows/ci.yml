name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: |
            backend/package.json
            frontend/package.json

      - name: Verify Backend
        working-directory: ./backend
        run: |
          npm ci
          npx prisma generate
          npx tsc --noEmit
          npx tsx test/logic.test.ts

      - name: Verify Frontend
        working-directory: ./frontend
        run: |
          npm ci
          npm run build
